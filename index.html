<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#182015" />
    <meta name="description" content="A quiet seek-and-find game in a strange, abundant meadow." />
    <title>Money Meadow</title>
    <link rel="preload" href="./assets/scenes/cottage-garden.png" as="image" fetchpriority="high" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="book" id="page" aria-labelledby="game-title">
      <section class="book-page book-page--left">
        <div class="book-page__content">
          <header class="book-heading">
            <h1 id="game-title">Money Meadow</h1>
            <p class="scene-line">
              <span class="scene-number" id="scene-number">01</span>
              <span class="scene-title" id="scene-title">The cottage garden</span>
            </p>
          </header>

          <div class="challenge-block">
            <p class="challenge" id="instruction">Find the money.</p>
            <div class="progress" id="progress" role="status" aria-live="polite">
              <span class="progress__marks" id="progress-marks" aria-hidden="true"></span>
              <span class="sr-only" id="progress-text">0 of 2 found</span>
            </div>
          </div>

          <div class="book-actions">
            <button class="text-button" id="hint-button" type="button" hidden>Hint</button>
            <button class="sound-button" id="sound-button" type="button" aria-pressed="false" aria-label="Turn sound on">
              <span class="sound-button__mark" aria-hidden="true">♪</span>
              <span id="sound-label">Sound off</span>
            </button>
          </div>

          <div class="completion" id="completion" hidden>
            <p>Page complete.</p>
            <button class="turn-button" id="turn-button" type="button">Turn page <span aria-hidden="true">→</span></button>
          </div>
        </div>
        <p class="page-number page-number--left" id="left-page-number" aria-label="Left page 1">1</p>
      </section>

      <section class="book-page book-page--right" id="illustration-page" data-layout="plate" aria-label="Illustrated seek-and-find page">
        <div class="scene" id="scene" aria-label="Seek-and-find scene">
          <img class="scene__next-image" id="scene-next-image" alt="" draggable="false" aria-hidden="true" />
          <div class="page-sheet" id="page-sheet">
            <img id="scene-image" alt="" draggable="false" />
            <span class="page-sheet__back" aria-hidden="true"></span>
          </div>
          <span class="page-turn-shadow" aria-hidden="true"></span>
          <span class="page-fold" aria-hidden="true">
            <img class="page-fold__ghost" id="page-fold-image" alt="" draggable="false" />
          </span>
          <div class="ambient" id="ambient" aria-hidden="true"></div>
          <div class="hotspots" id="hotspots"></div>
          <button class="corner-turn" id="corner-turn" type="button" aria-label="Turn page" hidden>
            <span aria-hidden="true"></span>
          </button>
          <div class="scene__loading" id="scene-loading" role="status">Opening the next page...</div>
        </div>
        <p class="scene-caption" id="scene-caption" hidden></p>
        <p class="page-number page-number--right" id="right-page-number" aria-label="Right page 2">2</p>
      </section>
    </main>

    <div class="sr-only" id="announcer" aria-live="assertive"></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
